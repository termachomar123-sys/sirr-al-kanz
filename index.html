<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سِرّ الكنز</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      min-height: 25px;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div id="login">

    <h1>🗝️ سِرّ الكنز</h1>

    <p>تسجيل دخول الفريق</p>

    <input
      id="code"
      type="text"
      placeholder="كود الفريق"
      autocomplete="off"
    >

    <input
      id="password"
      type="password"
      placeholder="كلمة السر"
    >

    <button id="loginButton">
      دخول
    </button>

    <div id="message"></div>

  </div>


  <div id="dashboard">

    <h1>🎉 مرحباً!</h1>

    <p id="teamName"></p>

    <p>
      النقاط:
      <strong id="teamScore"></strong>
    </p>

    <p>
      التقدم:
      <strong id="teamProgress"></strong>
    </p>

    <button id="logoutButton">
      تسجيل الخروج
    </button>

  </div>

</div>


<script>

  // =====================================
  // معلومات Supabase
  // =====================================

  const SUPABASE_URL = "https://kmzkemzerswebqupwcox.supabase.co";

  const SUPABASE_KEY = "sb_publishable_OqnvdAEf0OzOmwq5ufCahg_0-WWriGS";


  // =====================================
  // إنشاء الاتصال
  // =====================================

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // =====================================
  // العناصر
  // =====================================

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const codeInput =
    document.getElementById("code");

  const passwordInput =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const loginDiv =
    document.getElementById("login");

  const dashboardDiv =
    document.getElementById("dashboard");

  const teamName =
    document.getElementById("teamName");

  const teamScore =
    document.getElementById("teamScore");

  const teamProgress =
    document.getElementById("teamProgress");


  // =====================================
  // كود الفريق
  // =====================================

  const teamEmails = {

    FALCON:
      "team_falcon@sirralkanz.local"

  };


  // =====================================
  // تسجيل الدخول
  // =====================================

  async function login() {

    message.textContent = "جاري الدخول...";

    const code =
      codeInput.value.trim().toUpperCase();

    const password =
      passwordInput.value;


    if (!code || !password) {

      message.textContent =
        "⚠️ دخل الكود وكلمة السر";

      return;
    }


    const email =
      teamEmails[code];


    if (!email) {

      message.textContent =
        "❌ كود الفريق غير صحيح";

      return;
    }


    try {

      const result =
        await client.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (result.error) {

        message.textContent =
          "❌ " + result.error.message;

        return;
      }


      const user =
        result.data.user;


      if (!user) {

        message.textContent =
          "❌ لم يتم العثور على المستخدم";

        return;
      }


      const teamResult =
        await client
          .from("teams")
          .select("name, score, progress, status")
          .eq("user_id", user.id)
          .single();


      if (teamResult.error) {

        message.textContent =
          "❌ " + teamResult.error.message;

        return;
      }


      const team =
        teamResult.data;


      teamName.textContent =
        team.name;

      teamScore.textContent =
        team.score ?? 0;

      teamProgress.textContent =
        team.progress ?? 0;


      loginDiv.style.display =
        "none";

      dashboardDiv.style.display =
        "block";


    } catch (error) {

      message.textContent =
        "❌ " + error.message;

    }

  }


  // =====================================
  // تسجيل الخروج
  // =====================================

  async function logout() {

    await client.auth.signOut();

    dashboardDiv.style.display =
      "none";

    loginDiv.style.display =
      "block";

    codeInput.value = "";

    passwordInput.value = "";

    message.textContent = "";

  }


  // =====================================
  // تشغيل الأزرار
  // =====================================

  loginButton.addEventListener(
    "click",
    login
  );


  logoutButton.addEventListener(
    "click",
    logout
  );

</script>

</body>
</html>
