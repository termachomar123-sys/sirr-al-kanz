<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سِرّ الكنز</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151c32;
      border: 1px solid #303b5c;
      border-radius: 20px;
      padding: 30px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8d0;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #3a4668;
      border-radius: 12px;
      background: #0e1528;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #7c8cff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #6675f5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      min-height: 24px;
      color: #ffcc66;
    }

    #dashboard {
      display: none;
    }

    .info {
      background: #0e1528;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .logout {
      margin-top: 20px;
      background: #9b3d4d;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- LOGIN -->
    <div id="login">
      <h1>🗝️ سِرّ الكنز</h1>
      <div class="subtitle">مغامرة الكنز — AMEJ الكارة</div>

      <label for="code">كود الفريق</label>
      <input
        id="code"
        type="text"
        placeholder="مثال: FALCON"
        autocomplete="off"
      >

      <label for="password">كلمة السر</label>
      <input
        id="password"
        type="password"
        placeholder="كلمة السر"
      >

      <button id="loginButton">دخول</button>

      <div id="message"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
      <h1>🗺️ مرحباً</h1>

      <div class="info">
        <strong>الفريق:</strong>
        <span id="teamName"></span>
      </div>

      <div class="info">
        <strong>النقاط:</strong>
        <span id="teamScore"></span>
      </div>

      <div class="info">
        <strong>التقدم:</strong>
        <span id="teamProgress"></span>
      </div>

      <div class="info">
        <strong>الحالة:</strong>
        <span id="teamStatus"></span>
      </div>

      <button class="logout" id="logoutButton">تسجيل الخروج</button>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. ضع معلومات Supabase هنا
    // ==========================================

    const SUPABASE_URL = "https://kmzkemzerswebqupwcox.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OqnvdAEf0OzOmwq5ufCahg_0-WWriGS";

    // ==========================================
    // 2. إنشاء اتصال Supabase
    // ==========================================

    const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
    );

    // ==========================================
    // 3. العناصر
    // ==========================================

    const loginDiv = document.getElementById("login");
    const dashboardDiv = document.getElementById("dashboard");

    const codeInput = document.getElementById("code");
    const passwordInput = document.getElementById("password");

    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");

    const message = document.getElementById("message");

    const teamName = document.getElementById("teamName");
    const teamScore = document.getElementById("teamScore");
    const teamProgress = document.getElementById("teamProgress");
    const teamStatus = document.getElementById("teamStatus");

    // ==========================================
    // 4. ربط كود الفريق بالإيميل الداخلي
    // ==========================================

    const teamEmails = {
      FALCON: "team_falcon@sirralkanz.local"
    };

    // ==========================================
    // 5. جلب معلومات الفريق
    // ==========================================

    async function loadTeam(userId) {

      const { data, error } = await supabaseClient
        .from("teams")
        .select("id, name, code, team_number, score, progress, status")
        .eq("user_id", userId)
        .single();

      if (error) {
        throw new Error(
          "تعذر جلب معلومات الفريق: " + error.message
        );
      }

      return data;
    }

    // ==========================================
    // 6. عرض Dashboard
    // ==========================================

    function showDashboard(team) {

      loginDiv.style.display = "none";
      dashboardDiv.style.display = "block";

      teamName.textContent = team.name;
      teamScore.textContent = team.score ?? 0;
      teamProgress.textContent = team.progress ?? 0;
      teamStatus.textContent = team.status ?? "غير محدد";
    }

    // ==========================================
    // 7. تسجيل الدخول
    // ==========================================

    async function login() {

      const code = codeInput.value.trim().toUpperCase();
      const password = passwordInput.value;

      message.textContent = "";

      if (!code || !password) {
        message.textContent = "⚠️ دخل الكود وكلمة السر";
        return;
      }

      const email = teamEmails[code];

      if (!email) {
        message.textContent = "❌ كود الفريق غير صحيح";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "جاري الدخول...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw new Error(error.message);
        }

        if (!data.user) {
          throw new Error("لم يتم العثور على المستخدم");
        }

        const team = await loadTeam(data.user.id);

        showDashboard(team);

      } catch (error) {

        console.error(error);

        message.textContent = "❌ " + error.message;

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "دخول";
      }
    }

    // ==========================================
    // 8. تسجيل الخروج
    // ==========================================

    async function logout() {

      await supabaseClient.auth.signOut();

      dashboardDiv.style.display = "none";
      loginDiv.style.display = "block";

      codeInput.value = "";
      passwordInput.value = "";
      message.textContent = "";
    }

    // ==========================================
    // 9. التحقق من Session موجودة
    // ==========================================

    async function checkSession() {

      try {

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          console.error(error);
          return;
        }

        if (data.session && data.session.user) {

          const team =
            await loadTeam(data.session.user.id);

          showDashboard(team);
        }

      } catch (error) {

        console.error(error);
      }
    }

    // ==========================================
    // 10. تشغيل الأزرار
    // ==========================================

    loginButton.addEventListener("click", login);

    logoutButton.addEventListener("click", logout);

    passwordInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        login();
      }

    });

    // ==========================================
    // 11. تشغيل Session check
    // ==========================================

    checkSession();
  </script>

</body>
</html>
